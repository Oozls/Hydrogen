<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hydrogen 로그인</title>
  <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='img/favicon.jpg') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}" />
  <style>
    .login-wrap {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      width: 100%;
      max-width: 320px;
      padding: 32px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .login-title {
      margin: 0 0 24px;
      font-size: 18px;
      font-weight: 600;
      text-align: center;
    }
    .login-field {
      display: block;
      margin-bottom: 14px;
      font-size: 13px;
      color: var(--text-secondary);
    }
    .login-error {
      margin: -6px 0 14px;
      font-size: 13px;
      color: #e5484d;
    }
    .login-submit {
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      border: 1px solid var(--accent);
      border-radius: 6px;
      background: var(--accent);
      color: var(--icon-on-accent);
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1 class="login-title">Hydrogen 로그인</h1>
      {% if failed %}<p class="login-error">아이디 또는 비밀번호가 올바르지 않습니다.</p>{% endif %}
      <form method="post" action="{{ url_for('auth.login_submit') }}">
        <label class="login-field">아이디
          <input type="text" name="username" class="dialog-input" autocomplete="username" autofocus required />
        </label>
        <label class="login-field">비밀번호
          <input type="password" name="password" class="dialog-input" autocomplete="current-password" required />
        </label>
        <button type="submit" class="login-submit">로그인</button>
      </form>
    </div>
  </div>
</body>
</html>
