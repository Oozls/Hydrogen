<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>파일 탐색기 - Hydrogen</title>
  <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='img/favicon.jpg') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}" />
</head>
<body>
  <div class="logs-shell">
    <header class="panel logs-header">
      <a href="/" class="icon-btn" title="돌아가기">
        <span class="icon" style="--icon: url(/static/icons/chevron-left.svg)"></span>
      </a>
      <span class="section-title logs-title">파일 탐색기</span>
      <div class="spacer"></div>
      <button id="files-refresh-btn" class="icon-btn" title="새로고침">
        <span class="icon" style="--icon: url(/static/icons/repeat.svg)"></span>
      </button>
    </header>
    <main class="panel logs-list-panel">
      <div id="files-tree" class="files-tree"></div>
    </main>
  </div>

  <dialog id="file-content-dialog" class="library-picker-dialog file-content-dialog">
    <div class="library-picker-header">
      <h3 id="file-content-title"></h3>
      <div class="spacer"></div>
      <button id="file-content-close" class="icon-btn" title="닫기" type="button">
        <span class="icon" style="--icon: url(/static/icons/x.svg)"></span>
      </button>
    </div>
    <textarea id="file-content-body" class="file-content-body" spellcheck="false"></textarea>
    <div class="dialog-actions">
      <button id="file-content-save" class="primary" type="button">저장</button>
    </div>
  </dialog>

  <dialog id="confirm-dialog" class="library-picker-dialog confirm-dialog">
    <p id="confirm-dialog-message"></p>
    <input type="text" id="confirm-dialog-input" class="dialog-input" hidden />
    <div class="dialog-actions">
      <button id="confirm-dialog-cancel" type="button">취소</button>
      <button id="confirm-dialog-ok" class="primary" type="button">확인</button>
    </div>
  </dialog>

  <script type="module" src="{{ url_for('static', filename='js/files.js') }}"></script>
</body>
</html>
